<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{margin:0}body{font-family:system-ui,sans-serif;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<title>Hobbit x Piedmont Cube</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Alegreya:ital,wght@0,400;0,600;0,700;1,400&family=Alegreya+Sans+SC:wght@500;700&display=swap">
<style>
/* Layout: a single bound ledger column; standings first, then each draft as a chapter, then the card verdicts. */
:root {
  --bg: #efe6d0;          /* parchment */
  --page: #f7f0dd;        /* lighter leaf */
  --ink: #2b2418;
  --ink-soft: #6b5d45;
  --rule: #cdbd98;
  --red: #8e2a1f;         /* Red Book binding */
  --green: #2f5a3a;       /* round green door */
  --gold: #a67c1e;        /* the Ring */
  --win: #2f5a3a;
  --loss: #8e2a1f;
  --mana-w: #f4ecd2; --mana-u: #2a6ca8; --mana-b: #3b3433; --mana-r: #c2442b; --mana-g: #3f7d47; --mana-m: #c9a43a;
  --pip-edge: rgba(43,36,24,.35);
  --display: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --fell: "IM Fell English", "Iowan Old Style", Georgia, serif;
  --body: "Alegreya", "Iowan Old Style", Georgia, serif;
  --label: "Alegreya Sans SC", "Gill Sans", "Trebuchet MS", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #17140f; --page: #201b14; --ink: #ece2c8; --ink-soft: #b3a582; --rule: #4a3f2c;
  --red: #d06a55; --green: #7fb08a; --gold: #d9b14f; --win: #8cc097; --loss: #e07b66;
  --pip-edge: rgba(236,226,200,.35); color-scheme: dark;
}}
:root[data-theme="dark"] {
  --bg: #17140f; --page: #201b14; --ink: #ece2c8; --ink-soft: #b3a582; --rule: #4a3f2c;
  --red: #d06a55; --green: #7fb08a; --gold: #d9b14f; --win: #8cc097; --loss: #e07b66;
  --pip-edge: rgba(236,226,200,.35); color-scheme: dark;
}
* { box-sizing: border-box; }
:root { --map-ink: rgba(107, 93, 69, .24); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --map-ink: rgba(179, 165, 130, .15); } }
:root[data-theme="dark"] { --map-ink: rgba(179, 165, 130, .15); }
.mapbg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.book { position: relative; z-index: 1; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 17px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px 64px;
}
.book { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px; }

.crest-row { display: flex; align-items: center; justify-content: center; gap: clamp(12px, 4vw, 28px); margin-bottom: 10px; }
.crest-row svg.art { width: clamp(96px, 24vw, 136px); height: auto; max-width: 100%; display: block; }
.crest-row .x { font-family: var(--display); font-size: clamp(28px, 6vw, 40px); color: var(--gold); line-height: 1; }
header.title { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 8px; }
.eyebrow { font-family: var(--label); font-size: 13px; letter-spacing: .14em; color: var(--ink-soft); }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(38px, 7vw, 64px); line-height: 1; margin: 0; color: var(--red); text-wrap: balance; }
.subtitle { font-family: var(--fell); font-style: italic; font-size: 19px; color: var(--ink-soft); margin: 0; max-width: 34ch; text-wrap: balance; }
.flourish { width: 100%; max-width: 360px; height: 18px; color: var(--gold); }

h2 { font-family: var(--display); font-weight: 400; font-size: 30px; margin: 0; color: var(--ink); text-wrap: balance; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--rule); padding-bottom: 8px; margin-bottom: 16px; }
.section-head .note { font-family: var(--fell); font-style: italic; color: var(--ink-soft); font-size: 16px; }

/* Standings */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums lining-nums; }
th { font-family: var(--label); font-weight: 700; font-size: 13px; letter-spacing: .1em; color: var(--ink-soft); text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
td { padding: 12px 10px; border-bottom: 1px dotted var(--rule); vertical-align: middle; }
th.num, td.num { text-align: right; }
td.rank { font-family: var(--display); font-size: 22px; color: var(--gold); width: 1%; }
td.player { font-weight: 700; font-size: 19px; }
td.player small { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; font-weight: 400; font-size: 14px; color: var(--ink-soft); font-style: italic; }
.xbtn { white-space: nowrap; font-family: var(--label); font-style: normal; font-size: 12px; letter-spacing: .05em; padding: 1px 9px; border-radius: 999px; border: 1px solid var(--rule); background: color-mix(in srgb, var(--page) 35%, transparent); color: var(--ink-soft); cursor: pointer; }
.xbtn:not(.edit)::after { content: " ▾"; }
.deck-tools { display: inline-flex; align-items: baseline; gap: 10px; }
.xbtn.edit { font-size: 13px; padding: 3px 12px; }
.xbtn.edit[aria-pressed="true"] { color: var(--ink); border-color: color-mix(in srgb, var(--ink) 45%, transparent); background: color-mix(in srgb, var(--ink) 12%, transparent); }
.edit-in { font: inherit; color: var(--ink); background: color-mix(in srgb, var(--page) 70%, transparent); border: 1px solid var(--rule); border-radius: 4px; padding: 3px 7px; min-width: 0; }
.edit-in:focus-visible { outline: none; border-color: var(--gold); }
.edit-name { width: 100%; min-width: 6.5em; max-width: 16em; font-weight: 700; margin-bottom: 4px; display: block; }
.edit-pilot { width: 100%; min-width: 4.5em; max-width: 8em; }
.edit-num::-webkit-inner-spin-button, .edit-num::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
table.editing th, table.editing td { padding-left: 5px; padding-right: 5px; }
table.editing th:first-child, table.editing td.rank { display: none; }
.edit-rec { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.edit-num { width: 2.4em; -moz-appearance: textfield; text-align: center; padding: 3px 2px; font-variant-numeric: tabular-nums; }
.xbtn[aria-expanded="true"] { color: var(--ink); border-color: color-mix(in srgb, var(--ink) 45%, transparent); background: color-mix(in srgb, var(--ink) 12%, transparent); }
.xbtn:not(.edit)[aria-expanded="true"]::after { content: " ▴"; }
.xbtn:focus-visible { outline: none; box-shadow: 0 0 0 2px color-mix(in srgb, var(--ink) 35%, transparent); }
tr.open td { border-bottom-color: transparent; }
tr.detail td { padding: 0 10px 18px; }
.deck-list .thumbs { gap: 8px; }
.deck-list .thumb { width: 64px; }
.deck-list .basics { margin: 10px 0 0; font-family: var(--fell); font-style: italic; color: var(--ink-soft); font-size: 15px; }
.rec { font-weight: 700; white-space: nowrap; }
.rec .w { color: var(--win); } .rec .l { color: var(--loss); }
.pct { color: var(--ink-soft); }

/* Mana pips */
.pips { display: inline-flex; align-items: center; gap: 3px; vertical-align: -3px; }
.pip.sm { width: 10px; height: 10px; }
.splash-mark { font-family: var(--label); font-size: 12px; line-height: 1; color: var(--ink-soft); margin: 0 1px; }
.pip { width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--pip-edge); display: inline-block; }
.pip.W { background: var(--mana-w); } .pip.U { background: var(--mana-u); } .pip.B { background: var(--mana-b); }
.pip.R { background: var(--mana-r); } .pip.G { background: var(--mana-g); }
.pip.M { background: conic-gradient(var(--mana-w) 0 20%, var(--mana-u) 0 40%, var(--mana-b) 0 60%, var(--mana-r) 0 80%, var(--mana-g) 0); }

/* Drafts */
.chapter { background: var(--page); border: 1px solid var(--rule); border-radius: 3px; padding: 20px clamp(16px, 4vw, 28px) 24px; display: flex; flex-direction: column; gap: 18px; }
.chapter-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.chapter-head h3 { font-family: var(--display); font-weight: 400; font-size: 26px; margin: 0; color: var(--red); }
.chapter-head .meta { font-family: var(--label); font-size: 13px; letter-spacing: .1em; color: var(--ink-soft); display: flex; gap: 10px; align-items: center; }
.chip { font-family: var(--label); font-size: 12px; letter-spacing: .1em; padding: 2px 9px; border-radius: 999px; border: 1px solid currentColor; }
.chip.live { color: var(--gold); }
.chip.done { color: var(--green); }
.decks { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.deck { border-top: 2px solid var(--rule); padding-top: 10px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.deck .who { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.deck .name { font-weight: 700; font-size: 19px; }
.deck .arch { font-family: var(--fell); font-size: 17px; }
.deck .colors { font-size: 14px; color: var(--ink-soft); }
.deck.champion { border-top-color: var(--gold); }
.matches { display: flex; flex-direction: column; gap: 4px; }
.matches h4, .card-row h4 { font-family: var(--label); font-weight: 700; font-size: 13px; letter-spacing: .1em; color: var(--ink-soft); margin: 0 0 4px; }
.match { font-family: var(--fell); font-size: 17px; }
.match b { font-family: var(--body); }
.match .score { font-family: var(--body); color: var(--ink-soft); font-variant-numeric: tabular-nums; }

/* Card verdicts */
.verdicts { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
@media (max-width: 640px) { .verdicts { grid-template-columns: 1fr; } }
.verdict h3 { font-family: var(--display); font-weight: 400; font-size: 24px; margin: 0 0 12px; }
.verdict.best h3 { color: var(--gold); }
.verdict.worst h3 { color: var(--red); }
.verdict p.lede { font-family: var(--fell); font-style: italic; color: var(--ink-soft); margin: 2px 0 14px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
.card { margin: 0; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.card img { width: 100%; max-width: 100%; aspect-ratio: 488 / 680; object-fit: cover; border-radius: 4.75% / 3.5%; box-shadow: 0 2px 8px rgba(0,0,0,.25); display: block; }
.card figcaption { font-size: 14px; line-height: 1.35; }
.card figcaption b { display: block; font-size: 15px; }
.card figcaption span { color: var(--ink-soft); font-style: italic; }
.thumbs { display: flex; flex-wrap: wrap; gap: 10px; }
.thumb { width: 76px; padding: 0; border: 0; background: none; cursor: zoom-in; border-radius: 4px; }
.thumb img { width: 100%; max-width: 100%; aspect-ratio: 488 / 680; object-fit: cover; border-radius: 4.75% / 3.5%; box-shadow: 0 1px 4px rgba(0,0,0,.3); display: block; transition: transform .15s ease; }
.thumb:hover img, .thumb:focus-visible img { transform: translateY(-3px); }
.thumb:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.preview { position: fixed; z-index: 50; width: min(290px, 72vw); pointer-events: none; display: flex; flex-direction: column; gap: 6px; }
.preview img { width: 100%; aspect-ratio: 488 / 680; border-radius: 4.75% / 3.5%; box-shadow: 0 12px 32px rgba(0,0,0,.45); display: block; }
.preview .cap { background: var(--page); border: 1px solid var(--rule); border-radius: 3px; padding: 6px 10px; font-size: 14px; font-style: italic; color: var(--ink-soft); }
@media (prefers-reduced-motion: reduce) { .thumb img { transition: none; } }
.pip.C { background: #b7b0a2; }
.cube-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.search { font: inherit; font-size: 15px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--rule); background: var(--page); color: var(--ink); width: 220px; max-width: 100%; min-width: 0; }
.color-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.cchip { font-family: var(--label); font-size: 14px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--rule); background: color-mix(in srgb, var(--page) 35%, transparent); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; min-height: 28px; }
.cchip[aria-pressed="true"] { background: color-mix(in srgb, var(--ink) 22%, transparent); color: var(--ink); border-color: color-mix(in srgb, var(--ink) 45%, transparent); font-weight: 700; }
.cchip:focus { outline: none; }
.cchip:focus-visible { outline: none; box-shadow: 0 0 0 2px color-mix(in srgb, var(--ink) 35%, transparent); }
.cchip .pip { width: 13px; height: 13px; }
.cchip .five { width: 18px; height: 18px; display: block; }
.cchip .five circle { stroke: var(--pip-edge); stroke-width: .6; }
.search:focus-visible, .tbtn:focus-visible, .rm:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.hint { font-family: var(--fell); font-style: italic; color: var(--ink-soft); margin: -4px 0 12px; font-size: 15px; }
.cube-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 14px 10px; }
.ccard { position: relative; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.ccard .thumb { width: 100%; }
.ccard.is-top .thumb img { box-shadow: 0 0 0 2px var(--gold), 0 1px 4px rgba(0,0,0,.3); }
.ccard.is-bottom .thumb img { box-shadow: 0 0 0 2px var(--red), 0 1px 4px rgba(0,0,0,.3); }
.copies { position: absolute; top: 4px; left: 4px; font-family: var(--label); font-size: 12px; font-weight: 700; line-height: 1; padding: 3px 6px; border-radius: 999px; background: rgba(20,16,10,.82); color: #f7f0dd; pointer-events: none; }
.tbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.tbtn { font-family: var(--label); font-size: 12px; letter-spacing: .04em; padding: 3px 0; border-radius: 3px; border: 1px solid var(--rule); background: var(--page); color: var(--ink-soft); cursor: pointer; }
.tbtn.top[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); font-weight: 700; }
.tbtn.bot[aria-pressed="true"] { border-color: var(--red); color: var(--red); font-weight: 700; }
.tier-item { position: relative; }
.rm { position: absolute; top: -7px; right: -7px; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--rule); background: var(--page); color: var(--ink-soft); font-size: 14px; line-height: 1; cursor: pointer; display: grid; place-items: center; padding: 0; }
.empty { border: 1px dashed var(--rule); border-radius: 3px; padding: 20px 16px; text-align: center; font-family: var(--fell); font-style: italic; color: var(--ink-soft); }

footer { text-align: center; font-family: var(--fell); font-style: italic; color: var(--ink-soft); font-size: 15px; }
</style>

<div class="book">
  <header class="title">
    <div class="crest-row">
      <svg class="art" viewBox="0 0 140 140" role="img" aria-label="A round green hobbit-hole door set into a grassy hill">
        <defs><clipPath id="disc"><circle cx="70" cy="70" r="68"/></clipPath></defs>
        <g clip-path="url(#disc)">
          <rect width="140" height="140" fill="#cfe0e6"/>
          <circle cx="112" cy="30" r="10" fill="#f1d77a"/>
          <path d="M-10 74 Q70 18 150 74 V150 H-10 Z" fill="#6f9a4c"/>
          <path d="M-10 92 Q70 50 150 92 V150 H-10 Z" fill="#5c8740"/>
          <circle cx="70" cy="98" r="36" fill="#a8936a"/>
          <circle cx="70" cy="98" r="30" fill="#2f5a3a"/>
          <g stroke="#264a30" stroke-width="1.5"><line x1="52" y1="74" x2="52" y2="124"/><line x1="64" y1="68" x2="64" y2="128"/><line x1="76" y1="68" x2="76" y2="128"/><line x1="88" y1="74" x2="88" y2="124"/></g>
          <circle cx="70" cy="98" r="4" fill="#e2b84a"/>
          <circle cx="28" cy="86" r="9" fill="#a8936a"/><circle cx="28" cy="86" r="6" fill="#f3e2a8"/>
          <path d="M6 128 q4 -10 8 0 q4 -12 8 0 M112 126 q4 -10 8 0 q4 -12 8 0" stroke="#3f6a2c" stroke-width="2" fill="none"/>
          <rect x="20" y="128" width="100" height="14" fill="#b8a37b"/>
        </g>
        <circle cx="70" cy="70" r="68" fill="none" stroke="#a67c1e" stroke-width="3"/>
      </svg>
      <span class="x" aria-hidden="true">×</span>
      <svg class="art" viewBox="0 0 140 140" role="img" aria-label="A Piedmont Middle School pennant-style crest">
        <path d="M70 6 L128 22 V70 C128 104 102 124 70 134 C38 124 12 104 12 70 V22 Z" fill="#1f3a5f" stroke="#a67c1e" stroke-width="3"/>
        <path d="M70 16 L119 29 V70 C119 98 97 115 70 124 C43 115 21 98 21 70 V29 Z" fill="none" stroke="#e2c46c" stroke-width="1.2"/>
        <text x="70" y="44" text-anchor="middle" font-family="Alegreya Sans SC, Gill Sans, sans-serif" font-weight="700" font-size="11" letter-spacing="1.5" fill="#e2c46c">PIEDMONT</text>
        <text x="70" y="86" text-anchor="middle" font-family="IM Fell English SC, Georgia, serif" font-size="40" fill="#f7f0dd">PMS</text>
        <text x="70" y="104" text-anchor="middle" font-family="Alegreya Sans SC, Gill Sans, sans-serif" font-weight="500" font-size="9" letter-spacing="1.2" fill="#e2c46c">MIDDLE SCHOOL</text>
        <path d="M46 112 h48" stroke="#e2c46c" stroke-width="1"/>
      </svg>
    </div>
    <h1>Hobbit × Piedmont Cube</h1>
    <svg class="flourish" viewBox="0 0 360 18" aria-hidden="true"><path d="M0 9 H150 M210 9 H360" stroke="currentColor" stroke-width="1" fill="none"/><circle cx="180" cy="9" r="7" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="160" cy="9" r="2" fill="currentColor"/><circle cx="200" cy="9" r="2" fill="currentColor"/></svg>
  </header>

  <section>
    <div class="section-head"><h2>Decks</h2><span class="deck-tools"><span class="note" id="deck-status" aria-live="polite"></span><button class="xbtn edit" id="edit-decks" type="button" aria-pressed="false" hidden>Edit</button></span></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th></th><th>Deck</th><th>Pilot</th><th class="num">Record</th></tr></thead>
        <tbody id="standings"></tbody>
      </table>
    </div>
  </section>

  <section>
    <div class="section-head"><h2>Power Rankings</h2><span class="note">A running list of best and worst cards in the cube</span></div>
    <div class="verdicts">
      <div class="verdict best"><h3>Best</h3><div id="best"></div></div>
      <div class="verdict worst"><h3>Worst</h3><div id="worst"></div></div>
    </div>
  </section>

  <section>
    <div class="section-head"><h2>The Cube</h2><span class="note" id="cube-note"></span></div>
    <div class="cube-tools" id="cube-tools">
      <input class="search" id="cube-search" type="search" placeholder="Search by name" aria-label="Search the cube by name">
      <div class="color-chips" id="color-chips">
        <button class="cchip" type="button" data-color="W" aria-pressed="false" aria-label="White"><span class="pip W"></span></button>
        <button class="cchip" type="button" data-color="U" aria-pressed="false" aria-label="Blue"><span class="pip U"></span></button>
        <button class="cchip" type="button" data-color="B" aria-pressed="false" aria-label="Black"><span class="pip B"></span></button>
        <button class="cchip" type="button" data-color="R" aria-pressed="false" aria-label="Red"><span class="pip R"></span></button>
        <button class="cchip" type="button" data-color="G" aria-pressed="false" aria-label="Green"><span class="pip G"></span></button>
        <button class="cchip" type="button" data-color="M" aria-pressed="false" aria-label="Multicolor"><svg class="five" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="3.8" r="2.9" style="fill:var(--mana-w)"/><circle cx="15.9" cy="8.1" r="2.9" style="fill:var(--mana-u)"/><circle cx="13.6" cy="15" r="2.9" style="fill:var(--mana-b)"/><circle cx="6.4" cy="15" r="2.9" style="fill:var(--mana-r)"/><circle cx="4.1" cy="8.1" r="2.9" style="fill:var(--mana-g)"/></svg></button>
        <button class="cchip" type="button" data-color="C" aria-pressed="false" aria-label="Colorless"><span class="pip C"></span></button>
        <button class="cchip" type="button" data-color="L" aria-pressed="false">Lands</button>
      </div>
    </div>
    <p class="hint" id="cube-hint" hidden>Use Top and Bottom under a card to move it into Best or Worst.</p>
    <div class="cube-grid" id="cube-grid"></div>
    <div class="empty" id="cube-empty" hidden>No cards match.</div>
  </section>

</div>

<script>
(function () {
  const data = JSON.parse(document.getElementById("ledger").textContent);
  const ROMAN = ["","I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII","XIII","XIV","XV","XVI","XVII","XVIII","XIX","XX"];
  const roman = n => ROMAN[n] || String(n);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const fmtDate = iso => new Date(iso + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
  const COLOR = {W:"White",U:"Blue",B:"Black",R:"Red",G:"Green",M:"Multicolor"};
  const pips = (colors, splash = []) => {
    const s = el("span", "pips");
    colors.forEach(c => { s.append(el("span", "pip " + c)); });
    if (splash.length) {
      s.append(el("span", "splash-mark", "+"));
      splash.forEach(c => { s.append(el("span", "pip sm " + c)); });
    }
    return s;
  };
  const record = (w, l) => { const s = el("span", "rec"); s.append(el("span", "w", w), "–", el("span", "l", l)); return s; };

  function recordIn(draft, player) {
    let w = 0, l = 0;
    draft.matches.forEach(m => { if (m.winner === player) w++; if (m.loser === player) l++; });
    return [w, l];
  }

  // Standings: one row per deck, across every draft
  const deckEdits = {};            // saved changes from the page: key -> { name, pilot, w, l }
  let editingDecks = false, deckStore = null;
  const openDecks = new Set();
  const deckKey = (d, dk) => "d" + d.id + "-" + dk.player.toLowerCase().replace(/[^a-z0-9]+/g, "-");
  function deckView(d, dk) {
    const [w0, l0] = recordIn(d, dk.player);
    const o = deckEdits[deckKey(d, dk)] || {};
    return {
      name: o.name || dk.archetype, pilot: o.pilot || dk.player,
      w: Number.isInteger(o.w) ? o.w : w0, l: Number.isInteger(o.l) ? o.l : l0
    };
  }
  const tbody = document.getElementById("standings");
  function renderStandings() {
    const rows = [];
    data.drafts.forEach(d => d.decks.forEach(dk => rows.push({ d, dk, key: deckKey(d, dk), v: deckView(d, dk), champ: d.champion === dk.player })));
    const pct = r => (r.v.w + r.v.l) ? r.v.w / (r.v.w + r.v.l) : -1;
    rows.sort((a, b) => (pct(b) - pct(a)) || (b.v.w - a.v.w) || (a.v.l - b.v.l) || (b.champ - a.champ) || a.v.name.localeCompare(b.v.name));
    tbody.replaceChildren();
    tbody.closest("table").classList.toggle("editing", editingDecks);
    let rank = 0, prevKey = null;
    rows.forEach((r, i) => {
      const rk = pct(r) + "/" + r.v.w + "/" + r.v.l;
      if (rk !== prevKey) rank = i + 1; prevKey = rk;
      const tr = el("tr"); tr.dataset.key = r.key;
      tr.append(el("td", "rank", roman(rank)));
      const deck = el("td", "player");
      if (editingDecks) {
        const inp = el("input", "edit-in edit-name"); inp.type = "text"; inp.maxLength = 40; inp.value = r.v.name;
        inp.dataset.f = "name"; inp.setAttribute("aria-label", "Deck name"); deck.append(inp);
      } else deck.append(r.v.name + (r.champ ? " ♛" : ""));
      const sub = el("small"); const pp = pips(r.dk.colors, r.dk.splash); pp.title = r.dk.colorName; pp.setAttribute("role", "img"); pp.setAttribute("aria-label", r.dk.colorName); sub.append(pp); deck.append(sub);
      let xbtn = null;
      if (r.dk.cards && r.dk.cards.length) {

  }
  // Save one deck's edits when an input changes
  tbody.addEventListener("change", e => {
    const inp = e.target.closest(".edit-in"); if (!inp || !deckStore) return;
    const tr = inp.closest("tr"), key = tr.dataset.key;
    const get = f => tr.querySelector(`[data-f="${f}"]`);
    const num = f => { const n = parseInt(get(f).value, 10); return Number.isFinite(n) ? Math.max(0, Math.min(99, n)) : 0; };
    const o = { name: get("name").value.trim(), pilot: get("pilot").value.trim(), w: num("w"), l: num("l") };
    deckEdits[key] = o;
    deckStore.save(key, o);
  });
  const editBtn = document.getElementById("edit-decks");
  editBtn.addEventListener("click", () => {
    editingDecks = !editingDecks;
    editBtn.textContent = editingDecks ? "Done" : "Edit";
    editBtn.setAttribute("aria-pressed", String(editingDecks));
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();

  });
  function enableDeckEditing(store) { deckStore = store; editBtn.hidden = false; }
  renderStandings();

  // Drafts
  const draftsEl = document.getElementById("drafts");
  if (draftsEl) [...data.drafts].sort((a, b) => b.id - a.id).forEach(d => {
    const ch = el("article", "chapter"); ch.id = "draft-" + d.id;
    const head = el("div", "chapter-head");
    head.append(el("h3", null, "Draft " + roman(d.id)));
    const meta = el("div", "meta");
    meta.append(el("span", null, fmtDate(d.date)));
    meta.append(el("span", "chip " + (d.status === "live" ? "live" : "done"), d.status === "live" ? "In progress" : (d.champion ? "Won by " + d.champion : "Complete")));

      kr.append(cardGrid(d.keyCards)); ch.append(kr);
    }
    draftsEl.append(ch);
  });

  function cardGrid(list) {
    const g = el("div", "cards");
    list.forEach(c => {
      const f = el("figure", "card");
      const img = el("img"); img.src = c.img; img.alt = c.name; img.loading = "lazy"; f.append(img);
      const cap = el("figcaption"); cap.append(el("b", null, c.name));
      if (c.note) cap.append(el("span", null, c.note));
      f.append(cap); g.append(f);
    });
    return g;
  }
  // Thumbnails that open a large preview on hover, focus or tap
  const preview = el("div", "preview"); preview.hidden = true;
  const pImg = el("img"); pImg.alt = ""; const pCap = el("div", "cap");
  preview.append(pImg, pCap); document.body.append(preview);
  let current = null;
  function show(btn, c) {
    current = btn;
    pImg.src = c.img; pCap.textContent = c.note || ""; pCap.hidden = !c.note;
    preview.hidden = false;
    const r = btn.getBoundingClientRect(), w = preview.offsetWidth, h = preview.offsetHeight, m = 12;
    let left = r.right + m;
    if (left + w > innerWidth - m) left = r.left - m - w;
    if (left < m) left = Math.max(m, Math.min(innerWidth - w - m, r.left + r.width / 2 - w / 2));
    let top = r.top + r.height / 2 - h / 2;
    top = Math.max(m, Math.min(innerHeight - h - m, top));
    preview.style.left = left + "px"; preview.style.top = top + "px";
  }
  function hide() { preview.hidden = true; current = null; }
  addEventListener("scroll", hide, { passive: true });
  document.addEventListener("click", e => { if (!e.target.closest(".thumb")) hide(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") hide(); });
  function buildDeckList(host, dk) {
    const ORDER = { W: 0, U: 1, B: 2, R: 3, G: 4, M: 5, C: 6, L: 7 };
    const cards = dk.cards.map(id => byId.get(id)).filter(Boolean)
      .sort((a, b) => (ORDER[groupOf(a)] - ORDER[groupOf(b)]) || a.name.localeCompare(b.name));
    const wrap = el("div", "deck-list");
    const g = el("div", "thumbs");
    cards.forEach(c => g.append(makeThumb(c)));
    wrap.append(g);
    const b = Object.entries(dk.basics || {}).filter(([, n]) => n > 0);
    if (b.length) wrap.append(el("p", "basics", "Plus basic lands: " + b.map(([k, n]) => n + " " + k).join(", ")));
    host.append(wrap);
  }
  function makeThumb(c) {
    const b = el("button", "thumb"); b.type = "button";
    b.setAttribute("aria-label", c.name);
    const img = el("img"); img.src = c.img; img.alt = ""; img.loading = "lazy"; b.append(img);
    b.addEventListener("mouseenter", () => show(b, c));
    b.addEventListener("mouseleave", hide);
    b.addEventListener("focus", () => show(b, c));
    b.addEventListener("blur", hide);
    b.addEventListener("click", () => show(b, c));
    return b;
  }

  // The cube list and the two tiers
  const CUBE = JSON.parse(document.getElementById("cube").textContent);
  const byId = new Map(CUBE.map(c => [c.id, { ...c, img: c.img || ("cards/" + c.id + ".jpg") }]));
  const groupOf = c => c.land ? "L" : c.ci.length === 0 ? "C" : c.ci.length > 1 ? "M" : c.ci[0];
  let tiers = { top: [...data.best], bottom: [...data.worst] };
  let canWrite = false, tierRef = null;
  let cubeQuery = "", cubeColor = "", tiersLoading = false;

  function renderTier(id, list, emptyText, key) {
    const host = document.getElementById(id); host.replaceChildren();
    const cards = list.map(x => byId.get(x)).filter(Boolean);
    if (!cards.length) { host.append(el("div", "empty", emptyText)); return; }
    const g = el("div", "thumbs");
    cards.forEach(c => {
      const wrap = el("div", "tier-item"); wrap.append(makeThumb(c));
      if (canWrite) {
        const rm = el("button", "rm", "×"); rm.type = "button"; rm.setAttribute("aria-label", "Remove " + c.name);
        rm.addEventListener("click", () => setTier(c.id, key, false));
        wrap.append(rm);
      }
      g.append(wrap);
    });
    host.append(g);
  }
  const cubeNodes = CUBE.map(raw => {
    const c = byId.get(raw.id);
    const node = el("div", "ccard"); node.append(makeThumb(c));
    if (c.count > 1) { const cp = el("span", "copies", "×" + c.count); cp.title = c.count + " copies in the cube"; node.append(cp); }
    const btns = el("div", "tbtns");
    const top = el("button", "tbtn top", "Top"); top.type = "button"; top.setAttribute("aria-label", "Add " + c.name + " to Best");
    const bot = el("button", "tbtn bot", "Bottom"); bot.type = "button"; bot.setAttribute("aria-label", "Add " + c.name + " to Worst");
    top.addEventListener("click", () => setTier(c.id, "top", !tiers.top.includes(c.id)));
    bot.addEventListener("click", () => setTier(c.id, "bottom", !tiers.bottom.includes(c.id)));
    btns.append(top, bot); btns.hidden = true; node.append(btns);
    return { c, node, top, bot, btns };
  });
  function renderCube() {
    const grid = document.getElementById("cube-grid"), frag = document.createDocumentFragment(); let n = 0;
    cubeNodes.forEach(x => {
      const inTop = tiers.top.includes(x.c.id), inBot = tiers.bottom.includes(x.c.id);
      x.node.classList.toggle("is-top", inTop); x.node.classList.toggle("is-bottom", inBot);
      x.top.setAttribute("aria-pressed", String(inTop)); x.bot.setAttribute("aria-pressed", String(inBot));
      x.btns.hidden = !canWrite;
      if (cubeColor && groupOf(x.c) !== cubeColor) return;
      if (cubeQuery && !x.c.name.toLowerCase().includes(cubeQuery)) return;
      frag.append(x.node); n += x.c.count || 1;
    });
    grid.replaceChildren(frag);
    const CNAME = { W: "white", U: "blue", B: "black", R: "red", G: "green", M: "multicolor", C: "colorless", L: "land" };
    const word = n === 1 ? "card" : "cards";
    document.getElementById("cube-note").textContent = cubeQuery
      ? `${n} of ${CUBE.reduce((s, c) => s + (c.count || 1), 0)} cards`
      : cubeColor ? `${n} ${CNAME[cubeColor]} ${word}` : `${n} ${word}`;
    document.getElementById("cube-empty").hidden = n > 0;
    document.getElementById("cube-hint").hidden = !canWrite;
  }
  function renderCards() {
    renderTier("best", tiers.top, tiersLoading ? "Loading…" : "No cards here yet.", "top");
    renderTier("worst", tiers.bottom, tiersLoading ? "Loading…" : "No cards here yet.", "bottom");
    renderCube();
  }
  document.getElementById("cube-search").addEventListener("input", e => { cubeQuery = e.target.value.trim().toLowerCase(); renderCube(); });
  document.getElementById("color-chips").addEventListener("click", e => {
    const b = e.target.closest(".cchip"); if (!b) return;
    cubeColor = cubeColor === b.dataset.color ? "" : b.dataset.color;
    document.querySelectorAll(".cchip").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.color === cubeColor)));
    renderCube();
  });
  renderCards();

  // Shared tiers, saved through the group's Google Apps Script
  const API = "https://script.google.com/macros/s/AKfycbxFdb2bvsBVpN58jxoZFIOgIcxyCRuXZNTA7jNLoZF7BEgJUg7eMwhZ_LOj3IPB_h8/exec";
  let busy = 0;
  const st = el("span"); document.getElementById("cube-hint").append(" ", st);
  const setStatus = s => { st.textContent = s; };
  const clean = d => ({ top: d.top.filter(x => byId.has(x)), bottom: (d.bottom || []).filter(x => byId.has(x)) });
  function apply(d) {
    if (!d || !Array.isArray(d.top)) return;
    tiers = clean(d); tiersLoading = false;
    if (d.decks && typeof d.decks === "object" && !deckBusy) {
      Object.keys(deckEdits).forEach(k => delete deckEdits[k]);
      Object.entries(d.decks).forEach(([k, o]) => { deckEdits[k] = { name: o.name || "", pilot: o.pilot || "", w: Number.isInteger(o.w) ? o.w : undefined, l: Number.isInteger(o.l) ? o.l : undefined }; });
      if (!editingDecks) renderStandings();
    }
    try { localStorage.setItem("cube-tiers", JSON.stringify(tiers)); } catch (e) {}
    renderCards();
  }
  if (API) {
    let cached = null;
    try { cached = JSON.parse(localStorage.getItem("cube-tiers") || "null"); } catch (e) {}
    if (cached && Array.isArray(cached.top)) tiers = clean(cached);
    else { tiers = { top: [], bottom: [] }; tiersLoading = true; }
    renderCards();
  }
  function setTier(id, key, on) {
    const next = { top: tiers.top.filter(x => x !== id), bottom: tiers.bottom.filter(x => x !== id) };
    if (on) next[key].push(id);
    tiers = next; hide(); renderCards();
    if (!API) return;
    busy++; setStatus("Saving…");
    queuePost(() => ({ id, tier: on ? key : null, name: (byId.get(id) || {}).name || "" }))
      .then(d => { busy--; if (!busy) { apply(d); setStatus("Saved for everyone."); } })
      .catch(() => { busy--; setStatus("Couldn't save. Check your connection and try again."); });
  }
  // Send saves one at a time (the script is slow and locks while writing), retrying once on failure
  let chain = Promise.resolve();
  function postOnce(make) {
    return fetch(API, { method: "POST", body: JSON.stringify(make()) })
      .then(r => r.json())
      .then(d => { if (!d || d.error) throw new Error((d && d.error) || "no response"); return d; });
  }
  function queuePost(make) {
    const run = () => postOnce(make).catch(() => new Promise(res => setTimeout(res, 1500)).then(() => postOnce(make)));
    const p = chain.then(run, run);
    chain = p.catch(() => {});
    return p;
  }
  function pull() {
    if (!API || busy || deckBusy || document.hidden) return;
    fetch(API).then(r => r.json()).then(d => { if (!busy) apply(d); }).catch(() => {});
  }
  let deckBusy = 0;
  const deckStatus = document.getElementById("deck-status");
  if (API) {
    enableDeckEditing({ save(key, o) {
      deckBusy++; deckStatus.textContent = "Saving…";
      queuePost(() => { const x = deckEdits[key] || o; return { type: "deck", key, name: x.name, pilot: x.pilot, w: x.w, l: x.l }; })
        .then(d => { deckBusy--; if (!deckBusy) { deckStatus.textContent = "Saved"; apply(d); } })
        .catch(() => { deckBusy--; deckStatus.textContent = "Couldn't save. Check your connection and try again."; });
    } });
  }

    canWrite = true; renderCards();
    pull(); setInterval(pull, 30000);
    addEventListener("focus", pull);
    document.addEventListener("visibilitychange", pull);
  }
})();
</script>
<script>
// Aged map-paper texture, drawn behind the page
(function () {
  const cv = document.createElement("canvas"); cv.className = "mapbg"; cv.setAttribute("aria-hidden", "true");
  document.body.prepend(cv);
  const rng = seed => () => (seed = (seed * 16807) % 2147483647, (seed - 1) / 2147483646);
  let grain = null, grainKey = "";
  function grainTile(dark) {
    const key = dark ? "d" : "l"; if (grain && grainKey === key) return grain;
    const t = document.createElement("canvas"); t.width = t.height = 220;
    const c = t.getContext("2d"), img = c.createImageData(220, 220), r = rng(97);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = r(), light = v > .5;
      const base = light ? (dark ? 255 : 255) : (dark ? 0 : 70);
      img.data[i] = base; img.data[i + 1] = light ? base - 8 : base * .8; img.data[i + 2] = light ? base - 30 : base * .5;
      img.data[i + 3] = Math.floor(r() * (dark ? 14 : 22));
    }
    c.putImageData(img, 0, 0); grain = t; grainKey = key; return t;
  }
  function draw() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2), W = innerWidth, H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
    const cs = getComputedStyle(document.documentElement);
    const dark = cs.colorScheme === "dark" || cs.getPropertyValue("color-scheme").trim() === "dark";
    const stain = dark ? "0,0,0" : "120,78,30", hi = dark ? "255,236,200" : "255,250,236";
    const r = rng(23), M = Math.max(W, H);
    // mottled stains
    for (let i = 0; i < 22; i++) {
      const x = r() * W, y = r() * H, rad = M * (.12 + r() * .3), a = (dark ? .10 : .07) * (.4 + r());
      const gr = g.createRadialGradient(x, y, 0, x, y, rad);
      gr.addColorStop(0, `rgba(${stain},${a})`); gr.addColorStop(1, `rgba(${stain},0)`);
      g.fillStyle = gr; g.fillRect(0, 0, W, H);
    }
    // a few lighter worn patches
    for (let i = 0; i < 6; i++) {
      const x = r() * W, y = r() * H, rad = M * (.08 + r() * .18);
      const gr = g.createRadialGradient(x, y, 0, x, y, rad);
      gr.addColorStop(0, `rgba(${hi},${dark ? .025 : .18})`); gr.addColorStop(1, `rgba(${hi},0)`);
      g.fillStyle = gr; g.fillRect(0, 0, W, H);
    }
    // foxing spots
    for (let i = 0; i < 40; i++) {
      const x = r() * W, y = r() * H, rad = 1 + r() * 4;
      g.fillStyle = `rgba(${stain},${(dark ? .18 : .1) * r()})`;
      g.beginPath(); g.arc(x, y, rad, 0, Math.PI * 2); g.fill();
    }
    // paper fibres
    g.lineWidth = .6;
    for (let i = 0; i < 260; i++) {
      const x = r() * W, y = r() * H, a = r() * Math.PI, l = 4 + r() * 14;
      g.strokeStyle = `rgba(${r() > .5 ? stain : hi},${dark ? .08 : .09})`;
      g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a) * l * .5 + (r() - .5) * 4, y + Math.sin(a) * l * .5, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
    }
    // fold creases
    const fold = (x1, y1, x2, y2, ox, oy) => {
      g.lineWidth = 1.2; g.strokeStyle = `rgba(${stain},${dark ? .22 : .09})`;
      g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
      g.lineWidth = 1; g.strokeStyle = `rgba(${hi},${dark ? .04 : .35})`;
      g.beginPath(); g.moveTo(x1 + ox, y1 + oy); g.lineTo(x2 + ox, y2 + oy); g.stroke();
    };
    fold(W / 2, 0, W / 2, H, 1.5, 0);
    fold(0, H / 2, W, H / 2, 0, 1.5);
    // fine grain
    g.fillStyle = g.createPattern(grainTile(dark), "repeat"); g.fillRect(0, 0, W, H);
    // darkened, burnt-looking edges
    const v = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.hypot(W, H) * .62);
    v.addColorStop(0, `rgba(${stain},0)`); v.addColorStop(1, `rgba(${stain},${dark ? .55 : .3})`);
    g.fillStyle = v; g.fillRect(0, 0, W, H);
  }
  let t; const redraw = () => { clearTimeout(t); t = setTimeout(draw, 150); };
  addEventListener("resize", redraw);
  matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", draw);
  new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  draw();
})();
